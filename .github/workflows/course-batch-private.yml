name: Manual batch Mail.ru to YouTube (UNLISTED only)

on:
  workflow_dispatch:
    inputs:
      manifest_run_id:
        description: 'Successful course-discover GitHub Actions run ID'
        type: string
        required: true
      start:
        description: '1-based starting sequence'
        type: number
        required: true
        default: 1
      count:
        description: 'Number of lessons in batch (1-10)'
        type: number
        required: true
        default: 1
      dry_run:
        description: 'Preview selection WITHOUT uploading'
        type: boolean
        required: true
        default: true
      confirm_unlisted_upload:
        description: 'I authorize UNLISTED-only YouTube upload of this batch'
        type: boolean
        required: true
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: mailru-private-batch-ledger
  cancel-in-progress: false

jobs:
  upload-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download reviewed discovery manifest
        uses: actions/download-artifact@v4
        with:
          name: mailru-course-manifest
          run-id: ${{ inputs.manifest_run_id }}
          github-token: ${{ github.token }}
          path: .
      - name: Install dependencies
        run: |
          python -m pip install 'requests>=2.32,<3' 'google-api-python-client>=2.100,<3' 'google-auth>=2,<3'
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Preview or explicitly upload UNLISTED
        shell: bash
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          START: ${{ inputs.start }}
          COUNT: ${{ inputs.count }}
          DRY_RUN: ${{ inputs.dry_run }}
          CONFIRM_UNLISTED: ${{ inputs.confirm_unlisted_upload }}
          RECEIPT_GIT_PUSH: 'YES'
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" == "false" && "$CONFIRM_UNLISTED" == "true" ]]; then
            export CONFIRM_UNLISTED_UPLOAD=YES
            python course_batch_private.py --manifest course_manifest.json --start "$START" --count "$COUNT" --execute
          else
            python course_batch_private.py --manifest course_manifest.json --start "$START" --count "$COUNT"
          fi
      - name: Preserve any upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mailru-private-batch-receipts
          path: |
            receipts/*.json
            youtube-private-receipt.json
          retention-days: 30
          if-no-files-found: ignore
